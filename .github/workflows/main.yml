- name: Publish Android Release
  # You may pin to the exact commit or the version.
  # uses: deep-rent/publish-android-release@1ddd77852e22eef2e5f21b82ffc1b5c1ca712805
  uses: deep-rent/publish-android-release@v1.0.1
  with:
    # Path to the root Android project directory containing the gradlew executable.
    project-directory: android
    # Base64-encoded string representation of your Android release keystore (e.g., .jks or .keystore) file.
    keystore: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    # The password required to unlock the Android keystore.
    keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    # The alias of the signing key stored within the keystore.
    key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
    # The password for the specific signing key alias. Defaults to the keystore password.
    key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
    # The plain text JSON contents of the Google Cloud Service Account used to authenticate with the Google Play Developer API.
    service-account: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    # The application ID (package name) of the Android app (e.g., com.example.app).
    package-name: ${{ secrets.ANDROID_PACKAGE_NAME }}
    # The relative path to the generated Android App Bundle (AAB) file.
    release-file: app/build/outputs/bundle/release/app-release.aab
    # The relative path to the generated ProGuard/R8 mapping.txt file.
    mapping-file: app/build/outputs/mapping/release/mapping.txt
    # The Google Play track to publish the release to. Valid options are: internal, alpha, beta, production.
    track: internal
    # The status of the release. Valid options are: completed, draft, halted, inProgress.
    status: completed
