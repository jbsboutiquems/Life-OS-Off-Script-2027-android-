<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#f43f5e" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Outer Compass / Radar Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Central Asterisk / Star of Chaos (Off*Script Emblem) -->
  <g transform="translate(256, 240)" filter="url(#glow)">
    <!-- 8-point Unruly Star / Spark -->
    <path d="M 0,-90 L 16,-24 L 84,-56 L 36,4 L 90,40 L 24,36 L 40,94 L -12,42 L -64,80 L -36,20 L -94,-8 L -28,-18 Z" fill="url(#flame)" />
    <!-- Core Center Core -->
    <circle cx="0" cy="0" r="18" fill="#ffffff" />
  </g>
  
  <!-- Minimalist Typography: OFF*SCRIPT -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#f8fafc" letter-spacing="6">OFF*SCRIPT</text>
  <text x="256" y="452" text-anchor="middle" font-family="monospace" font-weight="700" font-size="16" fill="#fb7185" letter-spacing="4">LIFE OS 2027</text>
</svg>
