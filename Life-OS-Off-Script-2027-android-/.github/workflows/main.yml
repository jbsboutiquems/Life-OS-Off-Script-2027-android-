name: Publish Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Publish Android Release
        uses: deep-rent/publish-android-release@v1.0.1
        with:
          project-directory: android
          keystore: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          service-account: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          package-name: ${{ secrets.ANDROID_PACKAGE_NAME }}
          release-file: app/build/outputs/bundle/release/app-release.aab
          mapping-file: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
